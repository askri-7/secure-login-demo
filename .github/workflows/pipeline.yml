name: Application image CI/CD

on:
  workflow_dispatch:
    inputs:
      app_repository:
        description: Repository containing the application source
        required: true
        type: string
      app_ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      acr_name:
        description: Azure Container Registry name
        required: true
        type: string
      image_name:
        description: Image repository name
        required: true
        default: backend
        type: string
      dockerfile:
        description: Dockerfile path inside the application repository
        required: true
        default: Dockerfile
        type: string

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-push:
    name: Build, scan, and push immutable image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.APP_REPOSITORY_TOKEN }}

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve registry login server
        id: registry
        run: echo "login_server=$(az acr show --name '${{ inputs.acr_name }}' --query loginServer --output tsv)" >> "$GITHUB_OUTPUT"

      - name: Sign in to ACR
        run: az acr login --name "${{ inputs.acr_name }}"

      - name: Build image
        run: docker build --file "${{ inputs.dockerfile }}" --tag "${{ steps.registry.outputs.login_server }}/${{ inputs.image_name }}:${{ env.IMAGE_TAG }}" .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.registry.outputs.login_server }}/${{ inputs.image_name }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push immutable image
        run: docker push "${{ steps.registry.outputs.login_server }}/${{ inputs.image_name }}:${{ env.IMAGE_TAG }}"
