name: CI/CD

on:
  push:
    branches:
      - main
      - behind

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-login-demo-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-login-demo-frontend

jobs:

  # ============================================================
  # 1. CODE QUALITY + SECURITY
  # ============================================================

  code-security:
    name: Code Security
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2. BUILD CONTAINERS (PRODUCTION) — CLEAN BUILD, NO CACHE
  # ============================================================

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    #needs: code-security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Backend — CLEAN build, no cache layers from previous runs
      # ----------------------------------------------------------

      - name: Build backend (clean)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          no-cache: true                    # ← FORCE CLEAN BUILD
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          provenance: false
          sbom: false

      # ----------------------------------------------------------
      # Frontend — CLEAN build, no cache layers from previous runs
      # ----------------------------------------------------------

      - name: Build frontend (clean)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          no-cache: true                  
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          provenance: false
          sbom: false
  # ----------------------------------------------------------
      # Docker Scout
      # ----------------------------------------------------------

  
      # ----------------------------------------------------------
      # Docker Scout — DISABLED
      # ----------------------------------------------------------
      # - name: Scan backend with Docker Scout
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves
      #     image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      #     only-severities: critical,high
      #     exit-code: true
      #
      # - name: Scan frontend with Docker Scout
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves
      #     image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      #     only-severities: critical,high
      #     exit-code: true
      # ----------------------------------------------------------
      # Push only after security checks pass
      # ----------------------------------------------------------
      # ----------------------------------------------------------
      # Push both images
      # ----------------------------------------------------------

      - name: Push backend
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ============================================================
  # 3. DEPLOY TO VM
  # ============================================================

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/opt/secure-login-demo"
            cd $APP_DIR

            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
            export IMAGE_TAG="${{ github.sha }}"

            echo "[+] Pulling images for commit ${IMAGE_TAG}..."
            sudo docker compose -f docker-compose.prod.yml pull

            echo "[+] Restarting stack..."
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[+] Pruning old images..."
            sudo docker image prune -a -f --filter "until=168h"

            echo "[+] Waiting for health checks..."
            sleep 15

            echo "[+] Status:"
            sudo docker compose -f docker-compose.prod.yml ps

            echo "[+] Deployment complete."
