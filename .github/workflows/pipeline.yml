name: CI/CD

on:
  push:
    branches:
      - main
      - behind

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-login-demo-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-login-demo-frontend

jobs:

  # ============================================================
  # 1. CODE QUALITY + SECURITY
  # ============================================================

  code-security:
    name: Code Security
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2. BUILD CONTAINERS (PRODUCTION)
  # ============================================================

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
   # needs: code-security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Backend (production Dockerfile)
      # ----------------------------------------------------------

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod
          provenance: false
          sbom: false

      # ----------------------------------------------------------
      # Frontend (production Dockerfile)
      # ----------------------------------------------------------

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod
          provenance: false
          sbom: false

      # ----------------------------------------------------------
      # Docker Scout
      # ----------------------------------------------------------

  
      # ----------------------------------------------------------
      # Docker Scout — DISABLED
      # ----------------------------------------------------------
      # - name: Scan backend with Docker Scout
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves
      #     image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      #     only-severities: critical,high
      #     exit-code: true
      #
      # - name: Scan frontend with Docker Scout
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves
      #     image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      #     only-severities: critical,high
      #     exit-code: true
      # ----------------------------------------------------------
      # Push only after security checks pass
      # ----------------------------------------------------------

      - name: Push backend
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

 
    # ============================================================
  # 3. DEPLOY TO VM
  # ============================================================

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/opt/secure-login-demo"
            COMPOSE="docker compose -f ${APP_DIR}/docker-compose.prod.yml"

            echo "[+] Pulling latest images..."
            $COMPOSE pull

            echo "[+] Restarting stack..."
            $COMPOSE up -d --remove-orphans

            echo "[+] Waiting for health checks..."
            sleep 15

            echo "[+] Status:"
            $COMPOSE ps

            echo "[+] Deployment complete."