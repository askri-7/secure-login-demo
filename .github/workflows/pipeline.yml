name: Build, push, and deploy

on:
  push:
    branches: [release/3tiervm]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}
  # Set this repository variable from `terraform output -raw acr_name`.
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: isra-rg-01
  APP_VM_NAME: internship-dev-app-vm
  WEB_VM_NAME: internship-dev-web-vm

jobs:
  build-and-push:
    name: Build, scan, and push both images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription and ACR visibility
        run: |
          set -euo pipefail
          az account show --query '{tenantId:tenantId,subscriptionId:id,name:name}' --output table
          az acr list --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" --query '[].{name:name,resourceGroup:resourceGroup,loginServer:loginServer}' --output table

      - name: Resolve registry login server
        id: registry
        run: |
          set -euo pipefail
          if [ -z "${ACR_NAME}" ]; then
            echo "ACR_NAME repository variable is empty. Set it to the exact Terraform acr_name output."
            exit 1
          fi
          login_server=$(az acr show --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" --name "${ACR_NAME}" --query loginServer --output tsv) || {
            echo "ACR '${ACR_NAME}' was not found in the Azure subscription selected by AZURE_SUBSCRIPTION_ID."
            echo "Check AZURE_SUBSCRIPTION_ID and set ACR_NAME to the exact Terraform acr_name output."
            exit 1
          }
          if [ -z "${login_server}" ]; then
            echo "Azure returned an empty ACR login server for '${ACR_NAME}'."
            exit 1
          fi
          echo "login_server=${login_server}" >> "$GITHUB_OUTPUT"

      - name: Sign in to ACR
        run: az acr login --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" --name "${{ env.ACR_NAME }}"

      - name: Build backend image
        run: docker build --file backend/Dockerfile.prod --tag "${{ steps.registry.outputs.login_server }}/backend:${{ env.IMAGE_TAG }}" backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.registry.outputs.login_server }}/backend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push backend image
        run: docker push "${{ steps.registry.outputs.login_server }}/backend:${{ env.IMAGE_TAG }}"

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile.prod --tag "${{ steps.registry.outputs.login_server }}/frontend:${{ env.IMAGE_TAG }}" frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.registry.outputs.login_server }}/frontend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push frontend image
        run: docker push "${{ steps.registry.outputs.login_server }}/frontend:${{ env.IMAGE_TAG }}"

  deploy-app-vm:
    name: Redeploy backend and migrate on app VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pull, restart, and migrate on app VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.APP_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts '
              set -eu
              az login --identity
              az acr login --name "${{ env.ACR_NAME }}"
              cd /opt/app/compose
              set -a
              . ./.env
              set +a
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
              docker compose --env-file .env -f docker-compose.app.prod.yml pull
              docker compose --env-file .env -f docker-compose.app.prod.yml up -d
              sleep 15
              docker compose --env-file .env -f docker-compose.app.prod.yml exec -T backend npm run prisma:migrate:entra
              docker compose --env-file .env -f docker-compose.app.prod.yml exec -T backend npm run prisma:seed:entra
            '

  deploy-web-vm:
    name: Redeploy frontend on web VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pull and restart on web VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEB_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts '
              set -eu
              az login --identity
              az acr login --name "${{ env.ACR_NAME }}"
              cd /opt/web/compose
              set -a
              . ./.env
              set +a
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
              docker compose --env-file .env -f docker-compose.web.prod.yml pull
              docker compose --env-file .env -f docker-compose.web.prod.yml up -d
            '
