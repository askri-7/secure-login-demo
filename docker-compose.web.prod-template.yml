# Web VM production template.
# This VM has no PostgreSQL, Redis, Key Vault, or backend credentials.

services:
  frontend:
    image: ${{acr_login_server}}/${{frontend_image_name}}:${{image_tag}}
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${{app_vm_private_host}}
      BACKEND_PORT: "3000"
      DOMAIN_NAME: ${{domain_name}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot

  certbot-init:
    image: certbot/certbot:latest
    restart: "no"
    environment:
      DOMAIN_NAME: ${{domain_name}}
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c '
      set -e;
      mkdir -p /etc/letsencrypt/live/$${DOMAIN_NAME};
      if [ -f "/etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem" ]; then exit 0; fi;
      openssl req -x509 -nodes -newkey rsa:2048 -days 1
      -keyout /etc/letsencrypt/live/$${DOMAIN_NAME}/privkey.pem
      -out /etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem
      -subj "/CN=$${DOMAIN_NAME}";
      '

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  letsencrypt:
  certbot-www:
