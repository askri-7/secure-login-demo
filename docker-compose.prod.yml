# docker-compose.prod.yml — PRODUCTION ONLY (Azure VM)
# Pulls pre-built images from Docker Hub
# Secrets loaded from Azure Key Vault at runtime

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      AZURE_KEY_VAULT_NAME: ${AZURE_KEY_VAULT_NAME}
      # All other secrets (JWT_SECRET, DATABASE_URL, etc.) 
      # are loaded from Key Vault by the backend on startup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Backend port is NOT exposed to internet — only Nginx can reach it
    # ports: "3000:3000"  ← REMOVED for security
    depends_on:
      - redis

  frontend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"  # HTTPS port
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis is NOT exposed publicly — only backend can reach it
    # ports: "6379:6379"  ← REMOVED for security
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data: