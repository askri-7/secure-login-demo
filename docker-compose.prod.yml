# docker-compose.prod.yml — PRODUCTION (VM with containerized DB)
# Pulls pre-built images from Docker Hub

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # FIX: deploy.resources.limits is a Swarm-only construct and is silently
    # ignored by plain `docker compose up` (no --compatibility flag anywhere
    # in cloud-init or the deploy workflow). Use the direct keys instead —
    # these apply without any flag.
    mem_limit: 512M
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: creates a self-signed placeholder certificate so nginx can boot
  # on the very first run. Does NOT block frontend startup.
  certbot-init:
    image: certbot/certbot:latest
    restart: "no"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c '
      set -e;
      mkdir -p /etc/letsencrypt/live/$${DOMAIN_NAME};
      if [ -f "/etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem" ]; then
        echo "[certbot-init] Certificate already exists.";
        exit 0;
      fi;
      echo "[certbot-init] Creating self-signed placeholder certificate...";
      openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
        -keyout /etc/letsencrypt/live/$${DOMAIN_NAME}/privkey.pem \
        -out /etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem \
        -subj "/CN=$${DOMAIN_NAME}";
      echo "[certbot-init] Placeholder created.";
      '

  frontend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
      DOMAIN_NAME: ${DOMAIN_NAME}
    depends_on:
      backend:
        condition: service_started
      # FIX: without this, frontend can race certbot-init on a fresh volume
      # and crash on missing cert files, only recovering via restart-policy
      # crash-looping once the placeholder shows up. Wait for it explicitly.
      certbot-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    mem_limit: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Renewal-only daemon. Initial certificate is obtained by cloud-init.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # FIX: needed so the deploy-hook below can reload nginx after a
      # successful renewal. Trade-off: this grants the certbot container
      # effective root on the host (docker.sock access is equivalent to
      # root). Acceptable here since it's a small trusted stack, but worth
      # knowing — don't copy this into a multi-tenant or higher-stakes setup
      # without a narrower alternative (e.g. a small proxy that only allows
      # "exec nginx -s reload" on a fixed container name).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: >
      sh -c '
      apk add --no-cache docker-cli >/dev/null 2>&1;
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet \
          --deploy-hook "docker exec $$(docker ps -qf name=secure-login-demo-frontend) nginx -s reload";
        sleep 12h & wait $${!};
      done;
      '

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot-www: