# docker-compose.prod.yml — PRODUCTION (VM with containerized DB)
# Pulls pre-built images from Docker Hub

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # One-shot: gets the FIRST certificate before nginx ever needs to load one.
  certbot-init:
    image: certbot/certbot:latest
    restart: "no"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      OWNER_EMAIL: ${OWNER_EMAIL}
    ports:
      - "80:80"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c '
      if [ -f "/etc/letsencrypt/live/$${DOMAIN_NAME}/fullchain.pem" ]; then
        echo "[certbot-init] cert already exists, skipping.";
        exit 0;
      fi;
      echo "[certbot-init] no cert found, requesting one via standalone HTTP-01...";
      certbot certonly --standalone --preferred-challenges http
        -d "$${DOMAIN_NAME}"
        --email "$${OWNER_EMAIL}" --agree-tos --no-eff-email --non-interactive
      '

  frontend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
      DOMAIN_NAME: ${DOMAIN_NAME}
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx/default.conf.prod.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./db.env
   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

 
volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot-www: