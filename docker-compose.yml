# docker-compose.yml — LOCAL DEVELOPMENT ONLY
# Builds backend & frontend from source code on your machine

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Name the image after building (for caching)
    image: secure-login-demo-backend:local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secure-login-demo-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
    depends_on:
      - backend
    ports:
      - "80:80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-authdb}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: