services:
  backend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    image: ${DOCKERHUB_USERNAME}/secure-login-demo-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
    depends_on:
      - backend
    ports:
      - "80:80"

  # NEW: PostgreSQL for local dev (production uses Flexible Server)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-authdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # NEW: Redis for tokens, sessions, rate limiting
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: